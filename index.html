function X(){var x=S.x;if(!x){x=S.x={ev:[],od:[],sp:Math.max(0,lvl()-1),lv:lvl(),sk:{dg:0,ng:0,mc:0,an:0},won:0,rv:RN.map(function(r){var g=CO.filter(function(o){return o[0]==r[3]})[0];return{n:r[0],b:r[1],gr:r[2],co:r[3],r0:r[4],pr:0,by:0,col:[g[4][ri(0,g[4].length-1)]]}})}}return x}

function rvRep(r){return Math.round(r.r0+(Date.now()-S.t0)/3.6e6*1.5+r.by*.6)}

var _mk=mk;mk=function(){var c=_mk();c.price=R5(c.price*exm(c.n,1)*(1-.03*X().sk.ng));return c};
var _cc=chkCost;chkCost=function(c){return Math.max(1000,R5(_cc(c)*(1-.15*X().sk.dg)))};
var _b=A.buy;A.buy=function(id){var c=S.mkt.filter(function(x){return x.id==id})[0];if(c&&c.lie&&!c.chk&&Math.random()<.12*X().sk.dg){c.chk=1;c.fd=lieApply(c);toast('🔎 Эксперт заметил подвох: '+c.fd);return mlDraw()}_b(id)};

 x.ev.push({id:++S.seq,k:'deal',who:who,car:c,trap:Math.random()<(who?.5:.35),end:Date.now()+(who?9e4:6e4)});toast(who?'🤝 '+who+' предлагает сделку':'🔔 Владелец срочно продаёт редкий автомобиль!');xd()}

function spawn(){var x=X(),L=lvl(),r=Math.random(),n=Date.now(),b;
 if(r<.4&&S.mkt.length){b=brandOf(S.mkt[ri(0,S.mkt.length-1)].n);if(x.ev.some(function(e){return e.b==b}))return;
  if(r<.2){x.ev.push({id:++S.seq,k:'crash',b:b,end:n+24e4});S.mkt.forEach(function(c){if(brandOf(c.n)==b)c.price=R5(c.price*.75)});toast('📉 Обвал рынка: '+b+' дешевеет — закупайтесь!');log('Обвал рынка: '+b)}

 else if(r<.85){var g=S.cars.filter(function(c){return !c.rent})[0];if(!g)return;var v=value(g),q=MD.filter(function(m){return m[2]<=L+1&&m[1]>v*.8&&m[1]<v*1.6}),m=q[ri(0,q.length-1)];if(!m)return;var t=mk();t.n=m[0];t.cond=ri(55,92);t.fault=0;t.lie=0;t.price=0;
  x.ev.push({id:++S.seq,k:'swap',gid:g.id,gn:g.n,car:t,extra:Math.max(0,R5(value(t,false)*.95-v)),end:n+9e4});toast('🔄 Неожиданный обмен: предлагают '+t.n+' за вашу '+g.n);xd()}
 else order(1)}

 var q=x.rv.filter(function(r){return rvCap(r)>b.price*2});if(!q.length)return;var r=q[ri(0,q.length-1)],g=CO.filter(function(o){return o[0]==r.co})[0];
 S.mkt=S.mkt.filter(function(c){return c!=b});S.mkt.push(mk());r.pr+=R5((value(b,false)-b.price)*.6);r.by++;if(g[4].indexOf(b.n)>-1&&r.col.indexOf(b.n)<0)r.col.push(b.n);log(r.n+' выкупил '+b.n);if(tab=='market'){mlDraw();toast('🏴 '+r.n+' выкупил выгодное объявление: '+b.n)}}
