#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--mbg);color:var(--tx);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--sh);z-index:60}

.pips{display:flex;gap:4px;margin:8px 0 10px}.pips i{flex:1;height:6px;border-radius:9px;background:rgba(128,134,170,.28)}

@media (max-width:340px){#mn span{display:none}}

/* ---- ГАРАЖ: машина на фоне гаража (7 PNG + hue-rotate) ---- */
.gs{position:relative;margin:-15px -15px 12px;border-radius:18px 18px 0 0;overflow:hidden;aspect-ratio:16/10;min-height:180px;background:#14171d var(--gbg,none) center/cover no-repeat;isolation:isolate}
.gs:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 72%,transparent 45%,rgba(0,0,0,.45) 100%);pointer-events:none;z-index:1}
.gs-st{position:absolute;left:0;right:0;bottom:9%;height:56%;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.gs-sh{position:absolute;left:50%;bottom:-3%;width:78%;height:15%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,0) 72%);filter:blur(5px);z-index:0}
.gs-im{position:relative;z-index:1;display:block;max-width:85%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.gs-pl{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(20,24,32,.38);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(255,255,255,.18);color:#fff}
.gs-pl>div{min-width:0}
.gs-br{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.gs-md{font:700 15px Sora,Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-pr{font:700 14px Sora,Manrope,sans-serif;color:#7dffb0;white-space:nowrap}
.gs-cl{position:absolute;left:10px;bottom:10px;z-index:3;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(20,24,32,.38);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff}
@media(max-width:480px){.gs-md{font-size:13px}.gs-pr{font-size:12px}.gs-im{max-width:90%}}

/* ---- «Мой гараж»: процедурная сцена (слои SVG) ---- */
.gcs{position:relative;aspect-ratio:16/10;min-height:190px;margin:8px 0;border-radius:16px;overflow:hidden;background:#14171d;isolation:isolate;container-type:inline-size}
.gcs:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 52%,rgba(0,0,0,.42) 100%);pointer-events:none;z-index:4}
.gsc .gcs svg.gcb{position:absolute;inset:0;width:100%;height:100%;margin:0;border-radius:0;z-index:1}
.gsc .gcs svg.gcb.gcl{z-index:5;pointer-events:none;mix-blend-mode:screen}
.gcs-dm{position:absolute;inset:0;z-index:4;background:#060a1c;pointer-events:none}
.gsc .gcs svg.gd{position:absolute;z-index:3;width:12%;height:auto;margin:0;border-radius:0;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.gcs-c{position:absolute;transform:translateX(-50%);z-index:3;display:flex;justify-content:center}
.gcs-c .gs-im{max-width:100%;width:100%}
.gcs-sg{position:absolute;left:50%;top:21.5%;transform:translateX(-50%);z-index:6;max-width:46%;padding:.2em .8em;border:2px solid var(--sc);border-radius:7px;font-family:Sora,Manrope,sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sc)}
.gsg0{background:rgba(8,10,16,.62);text-shadow:0 0 8px var(--sc),0 0 2px var(--sc);box-shadow:0 0 14px var(--sc),inset 0 0 8px rgba(255,255,255,.08)}
.gsg1{background:var(--sc);color:#0d1016;border-color:rgba(0,0,0,.4);box-shadow:0 0 18px var(--sc),0 2px 0 rgba(0,0,0,.45)}
.gsg2{background:linear-gradient(180deg,#eef1f6,#9aa3b2 55%,#cdd3dd);color:#171a21;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.5)}
.gsg3{background:linear-gradient(180deg,#8a5a34,#5e3c20);color:var(--sc);border-color:#2e1c0e;text-shadow:0 1px 2px #000;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.gsg4{background:#0c0d12;color:var(--sc);border:3px dotted var(--sc);text-shadow:0 0 8px var(--sc);box-shadow:0 0 14px var(--sc)}
/* плашки выбора в редакторе гаража */
.gcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:6px 0 12px}
.gcg button{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:7px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;font-size:12px;cursor:pointer;text-align:left;min-width:0}
.gcg button i{display:block;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.18)}
.gcg button b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcg button small{color:var(--mut);font-size:11px}
.gcg button.own small{color:var(--ok)}
.gcg button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}

.fsq{max-width:340px;margin:2px auto 12px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.fsq .art{margin:0;height:auto;aspect-ratio:1/1;border-radius:0}.fsq .art img.ph{object-fit:cover;object-position:center}.fsq .art svg{padding:0 4%}
/* ---- карточки машин: фото + плашки + тёмная подложка ---- */
.car{overflow:hidden;margin-bottom:14px}
.car>.art{height:auto;aspect-ratio:16/10;margin-bottom:0;border-radius:0}
.car-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 -15px 12px;padding:14px 16px;background:rgba(6,8,12,.82);border-top:1px solid rgba(255,255,255,.06)}
.car-ft h3{min-width:0;font-size:16px;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car>.art .av{background:linear-gradient(145deg,#3fdc86,#12a35a)!important;top:10px;right:12px}
.car>.art .seg{top:12px}
.car-km{flex:none;font-size:13px;font-weight:600;color:#aab3c2;white-space:nowrap}
.gst{margin:10px 2px 0}.gst b{color:var(--ok)}
.gcg button i.gsw{font-style:normal;font-weight:800;position:static;transform:none;max-width:none;display:grid;place-items:center;height:34px;padding:0 4px;font-size:11px;letter-spacing:.03em;border-radius:7px;overflow:hidden}
/* ---- компактная шапка: главная — уменьшенная статистика, остальные вкладки — без неё ---- */
header{padding:8px 12px;margin-top:8px}
header .stats{gap:6px;margin-top:6px}
header .stat{padding:4px 8px;border-radius:12px;min-width:0;box-shadow:none}
header .stat small{font-size:9px;line-height:1.2;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .stat b{font-size:13px;line-height:1.2;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .bar{height:4px;margin-top:5px}
header #et{margin-top:2px;font-size:10px;line-height:1.2}
header #ev{font-size:10px;padding:1px 6px;margin-top:3px!important}
header.no-stats{padding-top:6px;padding-bottom:6px}
header.no-stats .stats,header.no-stats .bar,header.no-stats #et,header.no-stats #ev{display:none!important}
/* ---- хаб «Рынок» ---- */
.shop-back{margin:0 0 10px;padding:7px 14px}
.shop-h{margin:16px 2px 4px;font-size:18px}
.shop-grid,.shop-grid-small{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
.shop-c{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:136px;padding:14px;border-radius:16px;border:1px solid var(--line);text-align:left;font:inherit;color:var(--tx);cursor:pointer;
 background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 55%),var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 var(--hi);transition:transform .12s}
.shop-c:active{transform:scale(.97)}
.shop-c .si{position:absolute;top:12px;left:14px;font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.shop-c b{display:block;font-size:16px;line-height:1.2;padding-right:22px}
.shop-c small{display:block;color:var(--mut);font-size:12px}
.shop-c:after{content:"›";position:absolute;right:14px;bottom:10px;font-size:26px;line-height:1;color:var(--mut)}
.shop-grid-small .shop-c{min-height:92px;padding:12px;justify-content:flex-start;gap:2px}
.shop-grid-small .shop-c .si{position:static;display:block;font-size:26px;margin-bottom:6px}

@media(min-width:560px){.shop-grid{grid-template-columns:repeat(5,1fr)}.shop-grid-small{grid-template-columns:repeat(3,1fr)}.shop-grid-small .shop-c.wide{grid-column:auto}}
.kbal{display:flex;align-items:center;gap:6px;margin:8px 0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-size:12px;color:var(--mut)}
.kbal b{color:#4dd18b;font-size:15px}
.kstage{display:flex;justify-content:center;align-items:center;min-height:84px;margin:8px 0;padding:14px;border-radius:14px;background:linear-gradient(180deg,#141a33,#0b0f20);box-shadow:inset 0 2px 14px rgba(0,0,0,.6)}
.ktiles{display:flex;gap:8px}
.ktile{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.kwheel{position:relative;width:176px;height:176px;margin:14px auto 8px}
.kwheel svg{width:100%;height:100%;display:block}
.kptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #ffc83d;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.kdice{display:flex;gap:12px;justify-content:center;align-items:center;min-height:84px;padding:14px 0}
.kdice svg{filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.kres{min-height:20px;text-align:center;font-weight:700;margin:4px 0}
.sellban{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,200,60,.16),rgba(255,255,255,.02) 60%),var(--card)}
.sellban .sb-t{display:flex;align-items:center;gap:12px}
.sellban .sb-i{font-size:34px;line-height:1}
.sellban h3{margin:0 0 2px}
@media(max-width:559px){.shop-grid .shop-c:last-child:nth-child(odd){grid-column:1/-1}}
/* ---- Рувито ---- */
.rvbc{font-size:12px;color:var(--mut);margin:0 2px 6px}.rvbc a{color:var(--gold);cursor:pointer}.rvbc span{color:var(--tx)}
.rvg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rvt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 50%),var(--card);color:var(--tx);font:inherit;cursor:pointer;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.16),inset 0 1px 0 var(--hi);transition:transform .12s}
.rvt:active{transform:scale(.97)}
.rvt svg,.pimg svg{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rvt svg{width:44px;height:44px}
.rvt b{font:800 16px Sora,Manrope,sans-serif}.rvt small{color:var(--mut);font-size:12px}
.pimg{height:100%;display:grid;place-items:center;border-radius:10px;background:radial-gradient(ellipse at 50% 110%,hsl(var(--h) 60% 38%/.45),transparent 70%),linear-gradient(180deg,hsl(var(--h) 30% 16%),var(--card))}
.pimg svg{width:58px;height:58px}
.pimg{position:relative;overflow:hidden}.pimg .pph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ml,#pl2,.lgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){#ml,#pl2,.lgrid{grid-template-columns:1fr 1fr}}
#ml .lot,#pl2 .lot,.lgrid .lot{flex-direction:column;margin-bottom:0}
#ml .lp,#pl2 .lp,.lgrid .lp{width:100%;height:132px}
/* ---- номерной знак РФ ---- */
.reg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.reg-row .b{padding:7px 12px;font-size:13px}
/* ===== Реалистичные номера РФ (чистый CSS, всё в em: размер задаёт --fs) ===== */
.plate{--bg:#fff;--fg:#000;--fr:#000;--bolt:#1a1a1a;--fs:12px;font-size:var(--fs);position:relative;display:inline-flex;flex:none;box-sizing:border-box;vertical-align:middle;width:16.5em;height:3.7em;padding:.16em;
 background-color:var(--bg);background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.09));color:var(--fg);border:.12em solid #fff;border-radius:.55em;
 box-shadow:0 .12em .4em rgba(0,0,0,.45),inset 0 0 0 .05em rgba(0,0,0,.25);font-family:"Arial Narrow","Roboto Condensed","Liberation Sans Narrow","Nimbus Sans Narrow",Arial,sans-serif;font-stretch:condensed;font-weight:700;line-height:1;overflow:hidden;user-select:none;-webkit-user-select:none}
.plate:before{content:"";position:absolute;left:.6em;top:.6em;width:.26em;height:.26em;background:var(--bolt);border-radius:.06em;box-shadow:inset 0 0 0 .04em rgba(255,255,255,.28);z-index:2}
.plate .pl-in{flex:1;display:flex;min-width:0;border:.1em solid var(--fr);border-radius:.38em;overflow:hidden}
.plate .pl-main{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 .5em 0 1em}
.plate .pl-txt{display:inline-flex;align-items:baseline;font-size:2.15em;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;transform:scaleX(.88);transform-origin:center;text-shadow:0 .02em 0 rgba(255,255,255,.18)}
.plate .pl-g+.pl-g{margin-left:.16em}
.plate .pl-d{font-style:normal;font-size:.7em;margin:0 .1em}
.plate .pl-reg{flex:none;width:3.9em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.14em;border-left:.1em solid var(--fr)}
.plate .pl-reg b{display:block;font-size:1.65em;line-height:.9;letter-spacing:.02em;transform:scaleX(.9)}
.plate .pl-rus{display:flex;align-items:center;gap:.3em;font-size:.55em;font-weight:800;letter-spacing:.05em}
.plate .pl-flag{display:block;width:1.5em;height:1em;box-sizing:border-box;border:.07em solid var(--fr);background:linear-gradient(#fff 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
/* двухстрочные: .plate-trailer (буквы сверху, цифры снизу) и «квадратные» (цифры сверху, буквы снизу, как на референсе) */
.plate.pl-two{width:8.4em;height:6.8em}
.plate.pl-two .pl-in{flex-direction:column}
.plate.pl-two .pl-top{flex:1;display:flex;align-items:center;justify-content:center;padding:0 .8em}
.plate.pl-two .pl-top .pl-txt{font-size:2.5em}
.plate.pl-two .pl-bot{flex:none;display:flex;align-items:stretch;height:2.9em}
.plate.pl-two .pl-let{flex:1;display:flex;align-items:center;justify-content:center;padding:0 .3em}
.plate.pl-two .pl-let .pl-txt{font-size:2.1em}
.plate.pl-two .pl-let.long .pl-txt{font-size:1.6em;letter-spacing:0}
.plate.pl-two .pl-reg{width:3em;border-top:.1em solid var(--fr)}
.plate.pl-two .pl-reg b{font-size:1.5em}
/* типы */

.plate-police{--bg:#1b95d3;--fg:#fff;--fr:#fff;--bolt:#fff}
.plate-military{--bg:#111316;--fg:#fff;--fr:#f2f2f2;--bolt:#eee}

.plate-gold{background:linear-gradient(115deg,#fff7d1,#ffd95a 45%,#fff3b8 60%,#ffcf3a);box-shadow:0 0 0 2px #e0a800,0 0 16px rgba(255,196,40,.75)}

/* ===== v3: роспись в документах + рынок номеров ===== */
.sg-ov{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-start;justify-content:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:in .18s both}

.sg-doc{background:#fbf7ea;color:#1c1a14;border-radius:6px;padding:16px 16px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 1px rgba(120,100,50,.18);font-family:Georgia,"Times New Roman",serif;position:relative}
.sg-doc:before{content:"";position:absolute;inset:6px;border:1px solid rgba(120,100,50,.28);border-radius:3px;pointer-events:none}
.sg-hd{display:flex;justify-content:space-between;font:700 10px/1 Manrope,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7a6f4d;margin-bottom:10px}
.sg-doc h3{font:700 17px/1.25 Georgia,"Times New Roman",serif;color:#1c1a14;text-align:center;margin:0;letter-spacing:.01em}
.sg-sub{text-align:center;font-size:12px;color:#6d6446;margin:2px 0 12px;font-style:italic}
.sg-dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 10px;font-size:13px}
.sg-dl dt{color:#6d6446}
.sg-dl dd{margin:0;font-weight:700;text-align:right;border-bottom:1px dotted rgba(80,70,40,.4)}
.sg-txt{font-size:12px;line-height:1.5;margin:8px 0 12px;color:#2d2a20}
.sg-lbl{display:block;font-size:12px;color:#6d6446;margin-bottom:4px}
.sg-padw{position:relative;border:2px dashed rgba(0,31,63,.45);border-radius:8px;background:rgba(255,255,255,.55)}
#signature-pad{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair;border-radius:6px}
.sg-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:rgba(0,31,63,.38);font:italic 15px Georgia,serif;transition:opacity .15s}
.sg-hint.off{opacity:0}
.sg-line{position:absolute;left:14px;right:14px;bottom:30px;border-bottom:1px solid rgba(0,31,63,.3);pointer-events:none}
.sg-prog{height:4px;border-radius:3px;background:rgba(0,31,63,.12);margin-top:8px;overflow:hidden}
.sg-prog i{display:block;height:100%;width:0;background:#001f3f;transition:width .1s}
.sg-prog.ok i{background:#1c8f55}
.sg-note{font:600 11px Manrope,system-ui,sans-serif;color:#6d6446;margin-top:4px;text-align:right}
.sg-act{display:flex;gap:8px;margin-top:12px}
.sg-act .b{flex:1;padding:11px 6px}
.sg-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sg-pick:first-of-type{border-top:0}
/* типы номеров */
.plate.rc{box-shadow:0 0 0 2px var(--rc),0 0 18px var(--rc)}

/* ---- типы номеров РФ (по картинке) ---- */
/* вкладка «Номера» */
.pn-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;padding:12px 6px;border-radius:18px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% 100%,rgba(var(--gl),.2),transparent 70%)}
.pn-stage:active .plate,.pn-stage:active .pn-empty{transform:scale(.97)}
.pn-prev{min-height:32px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);opacity:.85}
.pn-pop{animation:pnIn .26s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pnIn{from{opacity:0;transform:translateY(14px) scale(.9)}}
.pn-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(100%,360px);padding:6px 12px;border-radius:12px;border:1px solid var(--rc,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--rc,#888) 28%,transparent),transparent);font-size:12px;font-weight:700}
.pn-chip span{color:var(--rc,var(--mut))}
.pn-empty{display:flex;align-items:center;justify-content:center;text-align:center;width:min(100%,330px);height:76px;border:2px dashed var(--line);border-radius:10px;color:var(--mut);font-size:13px;transition:transform .1s}
.pn-tg{min-height:18px;font-size:12px;color:var(--mut);text-align:center}
.pn-tap{width:100%;margin-top:6px;padding:13px;font-size:15px}
.pn-stage+.row .b,.pn-it .b{white-space:nowrap}
.pn-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut);margin-top:8px}
.pn-it{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.pn-it:first-of-type{border-top:0}
.pn-it .pn-i{flex:1;min-width:120px;font-size:12px;color:var(--mut)}
.pn-it .pn-i b{display:block;font-size:13px;color:var(--rc,var(--tx))}
.pn-it .b{padding:7px 11px;font-size:12px}
.pn-sel{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;font-size:14px;margin-top:8px}
.rr{position:absolute;bottom:8px;right:12px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid;backdrop-filter:blur(4px)}
.lp .rr{display:none}
.rr.sl,.tag.sl{color:#fff!important;border-color:#ffd36b!important;background:linear-gradient(90deg,#b8860b,#ff5e8a,#7b2ff7)}
.rr.sl{box-shadow:0 0 14px rgba(255,94,138,.55)}

/* ===== ОСЕНЬ → СЕРАЯ ПРИГЛУШЁННАЯ ТЕМА ===== */
:root{--bg:#141516;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--tx:#e7e4df;--mut:#a09d97;--gold:#d29a5f;--gt:#1d1409;--ok:#a8c67c;--bad:#e07d6e;--a0:#e6d2b8;--a1:#d4ab7e;--a2:#b27a42;--a3:#765025;--gl:190,140,90;--sh:0 12px 34px rgba(0,0,0,.6);--hi:rgba(255,255,255,.2);--inp:rgba(255,255,255,.07);--mbg:rgba(27,28,30,.95);--pill:rgba(255,255,255,.13);--b1:#e2c8a4;--b2:#c58b4f}
:root[data-theme="light"]{--bg:#c3c5c8;--card:rgba(244,244,242,.6);--line:rgba(60,64,72,.22);--tx:#1d1f23;--mut:#585b62;--gold:#8a4f20;--gt:#f3eee7;--ok:#46661e;--bad:#9c2f27;--a0:#e2d0b8;--a1:#c99c69;--a2:#a9672f;--a3:#76421a;--gl:140,100,70;--sh:0 0 0 1px rgba(40,44,52,.12),0 10px 26px rgba(30,34,42,.2);--hi:rgba(255,255,255,.6);--inp:rgba(255,255,255,.5);--mbg:rgba(232,233,233,.97);--pill:rgba(255,255,255,.5);--b1:#8a4f20;--b2:#b3692c}
button.b{color:#1d1409}
:root[data-theme="light"] button.b{color:#f3eee7;background:linear-gradient(180deg,#b07440,#8a4f20)}
.chips button.on{background:linear-gradient(180deg,var(--a1),var(--a2));color:#1d1409}
.gi{background:radial-gradient(circle at 32% 25%,#e8c79a,#b98048 55%,#7e4a22);box-shadow:0 0 0 8px rgba(185,128,72,.16),0 0 40px rgba(185,128,72,.4),inset 0 6px 12px rgba(255,255,255,.35)}
.fall{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:
 radial-gradient(70vmax 55vmax at 8% -8%,rgba(150,110,70,.16),transparent 62%),
 radial-gradient(60vmax 50vmax at 104% 26%,rgba(110,110,120,.14),transparent 62%),
 radial-gradient(70vmax 55vmax at 22% 108%,rgba(150,120,70,.12),transparent 62%),
 radial-gradient(50vmax 40vmax at 96% 104%,rgba(90,80,70,.2),transparent 62%)}
:root[data-theme="light"] .fall{background:
 radial-gradient(70vmax 55vmax at 8% -8%,rgba(255,255,255,.35),transparent 62%),
 radial-gradient(60vmax 50vmax at 104% 26%,rgba(120,125,135,.18),transparent 62%),
 radial-gradient(70vmax 55vmax at 22% 108%,rgba(150,125,90,.16),transparent 62%),
 radial-gradient(50vmax 40vmax at 96% 104%,rgba(100,95,90,.2),transparent 62%)}
.fall b{position:absolute;top:-8vh;font-weight:400;line-height:1;opacity:.0;will-change:transform,opacity;animation:lf linear infinite}
html.lowfx .fall,html.lowfx .aurora{display:none}html.lowfx .nft-art.l:after{animation:none}
@keyframes lf{0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:0}8%{opacity:.8}50%{transform:translate3d(var(--sw),55vh,0) rotate(calc(var(--rt)*.5))}92%{opacity:.7}100%{transform:translate3d(calc(var(--sw)*-.6),112vh,0) rotate(var(--rt));opacity:0}}
@media (prefers-reduced-motion:reduce){.fall b{animation:none;opacity:.35;top:calc(var(--y)*1%)}}

/* ---- фото машины целиком ---- */
.art img.ph,.fsq .art img.ph,.car>.art img.ph,.lp .art img.ph{object-fit:contain;object-position:center}
.art.has>svg{opacity:0}
.art.has:after{background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 30%,transparent 70%,rgba(0,0,0,.28))}
.fsq{max-width:none;width:100%}
.fsq .art{aspect-ratio:16/10}
/* ---- ПТС ---- */
.pts{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;--pp:#dcd5c3;--ink:#26272b;--bl:#1f3b78;--rd:#a32a22}
:root[data-theme="light"] .pts{--pp:#ece6d6}
.pts-bg{position:absolute;inset:0;background:rgba(10,11,13,.72);backdrop-filter:blur(3px);animation:ptsf .3s both}
@keyframes ptsf{from{opacity:0}}
.pts-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;perspective:1700px;animation:ptsin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ptsin{from{opacity:0;transform:translateY(40px) scale(.92) rotateX(14deg)}}
.pts-book{position:relative;width:min(88vw,350px);height:min(74vh,540px);transform-style:preserve-3d;transition:transform 1s ease}
.pts.open .pts-book{transform:translateX(4px)}
.pts-pg,.pts-cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pts-pg{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 7%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(60,50,30,.05) 23px 24px),var(--pp);color:var(--ink);padding:16px 16px 56px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);font:13px/1.35 "Courier New",ui-monospace,monospace;transition:transform 1s cubic-bezier(.5,.1,.3,1)}
.pts-pg.pg2{z-index:1;overflow:auto}
.pts-pg.pg1{z-index:2}
.pts-book.flip .pg1{transform:rotateY(-178deg)}
.pp-h{display:flex;flex-direction:column;gap:1px;text-align:center;font:800 12px Sora,system-ui,sans-serif;letter-spacing:.14em;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.pp-h em{font:700 14px "Courier New",monospace;letter-spacing:.08em;color:var(--rd);font-style:normal;margin-top:4px}
.pf{padding:5px 0;border-bottom:1px dashed rgba(40,40,40,.3)}
.pf small{display:block;font:600 9px Manrope,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6a665c}
.pf b{display:block;font:700 15px "Courier New",monospace;color:var(--bl);word-break:break-word}
.pf.big b{font-size:18px}.pf.mono b{font-size:13px;letter-spacing:.06em}
.pf.est b{color:var(--rd);font-size:16px}
.pf.plate b{display:inline-block;background:#f4f2ea;border:2px solid #222;border-radius:5px;padding:0 6px;color:#111;letter-spacing:.06em}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pts-pg .pn{font:500 11px Manrope,system-ui,sans-serif;color:#55524a}
.st-ok b{color:#1f6b3a}.st-warn b{color:#9a6a12}.st-bad b{color:var(--rd)}
.pols{margin-bottom:6px}
.po{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(40,40,40,.3);color:var(--bl);font-weight:700}
.po i{font-style:normal;flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--ink)}
.po span{flex:1;font-size:13px}.po small{color:#6a665c;font-size:11px;white-space:nowrap}
.stamp{position:absolute;right:14px;bottom:62px;border:3px double var(--rd);color:var(--rd);font:800 15px Sora,system-ui,sans-serif;letter-spacing:.12em;padding:6px 12px;border-radius:8px;transform:rotate(-14deg);opacity:0;mix-blend-mode:multiply}
.pts.open .stamp{animation:stp .45s cubic-bezier(.3,1.6,.5,1) 1.5s forwards}
@keyframes stp{from{opacity:0;transform:rotate(-14deg) scale(2.2)}to{opacity:.85;transform:rotate(-14deg) scale(1)}}
.pbtn{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 16px;font-size:13px;background:none!important;color:#3a3a40!important;border:1px solid #3a3a40!important}
.pts-cover{z-index:3;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.55,.05,.25,1),opacity .2s ease .9s}
.pts.open .pts-cover{transform:rotateY(-172deg);opacity:0}
.pts-cover .cf,.pts-cover .cb{position:absolute;inset:0;border-radius:4px 12px 12px 4px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pts-cover .cf{background:radial-gradient(120% 90% at 30% 10%,#34493f,#1d2c25);border:1px solid #0f1a15;box-shadow:inset 0 0 0 7px rgba(0,0,0,.14),inset 0 0 0 8px rgba(212,176,110,.35),0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#d8b878;text-align:center;font-family:Sora,system-ui,sans-serif}
.cf .cemb{font-size:56px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cf b{font-size:26px;letter-spacing:.2em}.cf span{font-size:13px;letter-spacing:.14em;font-weight:700;line-height:1.5}
.cf small{margin-top:18px;font:600 12px Manrope,sans-serif;opacity:.7;padding:0 18px}
.pts-cover .cb{transform:rotateY(180deg);background:#233a30}
.pclose{min-width:150px}
@media (prefers-reduced-motion:reduce){.pts-pg,.pts-cover,.pts-book,.pts-wrap{transition-duration:.01s;animation-duration:.01s}}

/* ---- бизнесы: картинки и таксопарк ---- */
.bzp{border-radius:14px;overflow:hidden;height:118px;margin:-2px -2px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.25)}
.bzimg{display:block;width:100%;height:100%}
.bzp{height:136px;border-radius:16px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.3)}
.bzph{position:relative;width:100%;height:100%;overflow:hidden}
.bzph img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .8s}
.bzph img.ph.ok{opacity:1}
.card:hover .bzph img.ph{transform:scale(1.06)}
.bzsh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 30%,rgba(0,0,0,.4))}
.bzp~.row h3{font:800 17px Sora,sans-serif;letter-spacing:-.01em}
.bzp~.row .tag{background:linear-gradient(90deg,rgba(var(--gl),.28),rgba(var(--gl),.06));color:var(--gold);border-color:rgba(var(--gl),.45);font-weight:700;box-shadow:0 0 12px rgba(var(--gl),.25)}
.bu .txbar i{background:linear-gradient(90deg,var(--a2),var(--a1));box-shadow:0 0 8px rgba(var(--gl),.45)}
.bzb,.bzst{transform-box:fill-box;animation:bzup 2.4s ease-in infinite}
@keyframes bzup{from{transform:translateY(8px);opacity:0}30%{opacity:.9}to{transform:translateY(-22px);opacity:0}}
.bzrot,.bzsp{transform-box:fill-box;transform-origin:center;animation:bzr 6s linear infinite}
.bzsp{animation-duration:4s}
@keyframes bzr{to{transform:rotate(360deg)}}
.bzdr{animation:bzd 3.2s ease-in-out infinite alternate}
@keyframes bzd{to{transform:translateX(14px)}}
.txu{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.txu .txn{font-weight:700;font-size:14px}
.txbar{height:6px;border-radius:6px;background:rgba(127,127,127,.2);margin:7px 0 8px;overflow:hidden}
.txbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffb300,#ffe082);transition:width .5s ease}
.txu button{width:100%}
/* ---- ПТС: оформление ---- */
.pts-book:after{content:"";position:absolute;left:6%;right:6%;bottom:-20px;height:22px;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);filter:blur(5px);pointer-events:none}
.pts-cover .cf{background:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 5px),radial-gradient(120% 90% at 30% 10%,#3d5a4c,#16241d);box-shadow:inset 0 0 0 7px rgba(0,0,0,.16),inset 0 0 0 8px rgba(212,176,110,.5),inset 0 0 0 16px rgba(0,0,0,.08),inset 0 0 0 17px rgba(212,176,110,.25),0 18px 50px rgba(0,0,0,.6);overflow:hidden}
.pts-cover .cf:before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,rgba(0,0,0,.5),transparent);border-radius:4px 0 0 4px}
.pts-cover .cf:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%) 130% 0/250% 100%;animation:ptsh 3.4s ease-in-out infinite}
@keyframes ptsh{to{background-position:-40% 0}}
.cf .cemb{filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));animation:cemb 3s ease-in-out infinite alternate}
@keyframes cemb{to{transform:translateY(-3px) scale(1.04)}}
.pts-cover .cf b{background:linear-gradient(100deg,#b58a3c,#f7e3a1 40%,#b58a3c 60%,#f0d38b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.pts-cover .cf span{color:#e2c47f;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.pts-pg:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 25% 15%,rgba(31,59,120,.055) 0 1.5px,transparent 1.5px 7px),repeating-radial-gradient(circle at 85% 85%,rgba(163,42,34,.05) 0 1.5px,transparent 1.5px 9px);mix-blend-mode:multiply;pointer-events:none}
.pts-pg:after{content:"★";position:absolute;right:-14px;top:36%;font-size:190px;line-height:1;color:rgba(31,59,120,.06);transform:rotate(-12deg);pointer-events:none}
.pp-h{border-bottom:3px double var(--ink)}
.pp-h span:first-child{color:var(--bl);font-size:15px}
.pf b{text-shadow:0 0 1px rgba(31,59,120,.25)}
.stamp{background:rgba(163,42,34,.06);box-shadow:inset 0 0 0 2px rgba(163,42,34,.25)}

.holo{position:absolute;left:16px;bottom:14px;width:40px;height:40px;border-radius:50%;background:conic-gradient(#ff6ec7,#ffd36e,#6effc4,#6ec8ff,#c46eff,#ff6ec7);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),0 0 0 1px rgba(0,0,0,.25);animation:holo 4s linear infinite}
.holo:after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:18px}
@keyframes holo{to{filter:hue-rotate(360deg)}}
.pts-pg .bar{position:absolute;right:16px;bottom:18px;width:70px;height:24px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 12px);opacity:.8}
.pts.open .pts-book{animation:ptsq .32s ease 1.85s}
@keyframes ptsq{25%{transform:translateX(4px) translateY(4px)}60%{transform:translateX(4px) translateY(-1px)}}
.pts.open .pg1 .pf{animation:pfi .45s ease both}
.pts.open .pg1 .pf:nth-child(2){animation-delay:.95s}.pts.open .pg1 .pf:nth-child(3){animation-delay:1.05s}.pts.open .pg1 .pg2{animation:pfi .45s ease 1.15s both}.pts.open .pg1 .pf:nth-child(5){animation-delay:1.25s}.pts.open .pg1 .pf:nth-child(6){animation-delay:1.35s}.pts.open .pg1 .pf:nth-child(7){animation-delay:1.45s}
@keyframes pfi{from{opacity:0;transform:translateY(8px)}}
/* ---- осмотр: анимация сканирования ---- */
.scn{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:16px}
.scn-bg{position:absolute;inset:0;background:rgba(6,10,16,.8);backdrop-filter:blur(4px);animation:ptsf .25s both}
.scn-box{position:relative;width:min(92vw,380px);background:#0c1420;border:1px solid rgba(80,200,255,.35);border-radius:18px;padding:14px;color:#cfe9ff;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(60,180,255,.18);animation:scni .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes scni{from{opacity:0;transform:translateY(24px) scale(.94)}}
.scn.out .scn-box,.scn.out .scn-bg{opacity:0;transform:scale(.97);transition:opacity .3s,transform .3s}
.scn-box.shk{animation:shk .4s ease}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.scn-t{display:flex;justify-content:space-between;font:800 12px Sora,system-ui,sans-serif;letter-spacing:.22em;color:#6fd3ff;margin-bottom:10px}
.scn-t .rec{color:#ff6b6b;letter-spacing:.1em;animation:blk 1s steps(2) infinite}

const rnd7 = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 7; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };

    return d;
  }),
  claimed: (id) => updateDoc(doc(db, 'listings', id), { claimed: true }),
  paid: (id) => updateDoc(doc(db, 'listings', id), { paid: true }),
  delListing: (id) => deleteDoc(doc(db, 'listings', id)),

  // --- обмен ---
  watchTrades(cb) {
    let a = [], b = [];
    const emit = () => cb(a.concat(b.filter((x) => !a.some((y) => y.id === x.id))));
    const u1 = onSnapshot(query(collection(db, 'trades'), where('from', '==', me.uid)), (s) => { a = rows(s); emit(); }, logErr('Обмен (исходящие)'));
    const u2 = onSnapshot(query(collection(db, 'trades'), where('to', '==', me.uid)), (s) => { b = rows(s); emit(); }, logErr('Обмен (входящие)'));
    return () => { u1(); u2(); };
  },
  async offer(t) {
    const r = await addDoc(collection(db, 'trades'), {
      from: me.uid, fn: myNick(), to: t.to, tn: t.tn, carA: t.carA, wantId: t.wantId, wantN: t.wantN, wantV: t.wantV,
      status: 'open', carB: null, fromDone: false, toDone: false, createdAt: Date.now()
    });
    return r.id;
  },
  tAccept: (id, carB) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.to !== me.uid) throw gone();
    tx.update(r, { status: 'accepted', carB, at: Date.now() });
    return d;
  }),
  tDecline: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().to !== me.uid) throw gone();
    tx.update(r, { status: 'declined', at: Date.now() });
    return true;
  }),
  tCancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().from !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled', at: Date.now() });
    return true;
  }),
  tDone: (id, side) => updateDoc(doc(db, 'trades', id), side === 'from' ? { fromDone: true } : { toDone: true }),
  tDel: (id) => deleteDoc(doc(db, 'trades', id)),

  // --- онлайн-торги ---
  watchAuc: (cb) => onSnapshot(query(collection(db, 'auctions'), where('status', '==', 'open'), limit(60)), (s) => cb(rows(s)), logErr('Торги')),
  watchAucMine: (cb) => onSnapshot(query(collection(db, 'auctions'), where('seller', '==', me.uid), where('sellerDone', '==', false)), (s) => cb(rows(s)), logErr('Мои торги')),
  watchAucWon: (cb) => onSnapshot(query(collection(db, 'auctions'), where('buyer', '==', me.uid), where('buyerDone', '==', false)), (s) => cb(rows(s)), logErr('Выигранные торги')),
  async aPost(a) {
    const r = await addDoc(collection(db, 'auctions'), {
      seller: me.uid, sn: myNick(), car: a.car, start: a.start, bid: a.start, lead: '', ln: '', cnt: 0, end: a.end,
      status: 'open', buyer: '', bn: '', buyerDone: false, sellerDone: false, createdAt: Date.now()
    });
    return r.id;
  },
  aBid: (id, amount) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data(), now = Date.now();
    if (d.status !== 'open' || d.end <= now || d.seller === me.uid || d.lead === me.uid) throw gone();
    const cnt = d.cnt || 0, min = cnt ? d.bid + Math.max(500, Math.round(d.bid * 0.03 / 500) * 500) : d.start;
    if (amount < min) throw new Error('low');
    tx.update(r, { bid: amount, lead: me.uid, ln: myNick(), cnt: cnt + 1, end: (d.end - now < 10000 ? now + 10000 : d.end) });
    return true;
  }),
  aWin: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.lead !== me.uid || d.end > Date.now()) throw gone();
    tx.update(r, { status: 'sold', buyer: me.uid, bn: myNick(), buyerDone: false });
    return d;
  }),
  aClose: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data(), now = Date.now(), cnt = d.cnt || 0;
    if (d.status !== 'open' || d.seller !== me.uid) throw gone();
    if (cnt > 0 && now <= d.end + 600000) throw gone();
    tx.update(r, { status: cnt > 0 ? 'unsold' : 'cancelled' });
    return true;
  }),
  aSellerDone: (id) => updateDoc(doc(db, 'auctions', id), { sellerDone: true }),
  aBuyerDone: (id) => updateDoc(doc(db, 'auctions', id), { buyerDone: true }),
  aDel: (id) => deleteDoc(doc(db, 'auctions', id)),

  // --- торг: покупка по цене не ниже минимальной (метка [торг от N] в note), сделка пишется в bn как «Ник|@цена» ---
  buyDeal: (id, deal) => runTransaction(db, async (tx) => {
    const r = doc(db, 'listings', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.seller === me.uid) throw gone();
    const m = /\[торг от (\d+)\]/.exec(String(d.note || '')), mn = m ? +m[1] : 0;
    deal = Math.round(+deal);
    if (!(mn > 0) || deal < mn || deal > d.price) throw new Error('bad-deal');
    tx.update(r, { status: 'sold', buyer: me.uid, bn: (myNick() + '|@' + deal).slice(0, 60), soldAt: Date.now() });
    return { ...d, price: deal };
  }),

  // --- эксклюзивные авто (коллекция excl): общий остаток ---
  exclWatch: (id, cb) => onSnapshot(doc(db, 'excl', id), (s) => cb(s.exists() && Number.isInteger(s.data().left) ? s.data().left : null), logErr('Эксклюзив')),
  exclBuy: (id, total) => runTransaction(db, async (tx) => {
    const r = doc(db, 'excl', id), s = await tx.get(r);
    const left = s.exists() ? s.data().left : total;
    if (!(left > 0)) throw gone();
    if (s.exists()) tx.update(r, { left: left - 1 }); else tx.set(r, { left: left - 1 });
    return left - 1;
  }),

  // --- гонки игроков (коллекция races) ---
  raceOpen: (cb) => onSnapshot(query(collection(db, 'races'), where('status', '==', 'open'), limit(40)), (s) => cb(rows(s)), logErr('Гонки')),
  raceMine: (cb) => onSnapshot(query(collection(db, 'races'), where('a', '==', me.uid), where('aDone', '==', false)), (s) => cb(rows(s)), logErr('Мои гонки')),
  async raceNew(x) {
    const r = await addDoc(collection(db, 'races'), { a: me.uid, an: myNick(), ca: x.ca, fee: x.fee, status: 'open', b: '', bn: '', cb: {}, aDone: false, createdAt: Date.now() });
    return r.id;
  },
  raceJoin: (id, car) => runTransaction(db, async (tx) => {
    const r = doc(db, 'races', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.a === me.uid) throw gone();
    tx.update(r, { status: 'done', b: me.uid, bn: myNick(), cb: car });
    return d;
  }),
  raceCancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'races', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    if (s.data().status !== 'open' || s.data().a !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled' });
  }),
  raceDone: (id) => updateDoc(doc(db, 'races', id), { aDone: true }),
  raceDel: (id) => deleteDoc(doc(db, 'races', id))
};

// ---- модерация: баны и админы ----
// Коллекции Firestore: bans/{uid}, admins/{uid}. Правила безопасности — см. файл firestore-admin.rules
const isAdm = () => !!(AE.admin && AE.admin.on);
const needAdm = () => { if (!isAdm() || AE.banned) throw new Error('forbidden'); };
const needOwner = () => { if (!(AE.admin && AE.admin.owner) || AE.banned) throw new Error('forbidden'); };
const cleanUid = (u) => String(u || '').trim().replace(/[^A-Za-z0-9_-]/g, '').slice(0, 128);
AE.adm = {
  async bans() { needAdm(); return rows(await getDocs(query(collection(db, 'bans'), orderBy('at', 'desc'), limit(100)))); },
  async admins() { needAdm(); return rows(await getDocs(query(collection(db, 'admins'), limit(100)))); },
  async players() {
    needAdm();
    const [cnt, snap, pres] = await Promise.all([
      getCountFromServer(collection(db, 'public')),
      getDocs(query(collection(db, 'public'), orderBy('nw', 'desc'), limit(1000))),
      getDocs(query(collection(db, 'presence'), limit(1000)))
    ]);
    const seen = {}; let online = 0; const now = Date.now();
    pres.docs.forEach((d) => { const t = +d.data().t || 0; seen[d.id] = t; if (now - t < 18e4) online++; });
    const list = snap.docs.map((d) => { const x = d.data(); return { uid: d.id, nick: x.nick, lv: x.lv, nw: x.nw, seen: seen[d.id] || +x.upd || 0 }; });
    list.sort((a, b) => b.seen - a.seen);
    return { total: cnt.data().count, online, list };
  },
  async grant(uid, nick, amount, take) {
    needAdm();
    uid = cleanUid(uid);
    if (!uid) throw new Error('nouid');
    amount = Math.floor(+amount || 0);
    if (!(amount >= 1 && amount <= 1e9)) throw new Error('badamt');
    if (uid === me.uid && !(AE.admin && AE.admin.owner)) throw new Error('selfgrant');
    await addDoc(collection(db, 'grants'), { to: uid, tn: cleanNick(nick), amount, by: me.uid, byName: myNick(), at: Date.now(), done: false, ...(take ? { take: true } : {}) });
  },
  async promos() { needAdm(); return rows(await getDocs(query(collection(db, 'promos'), orderBy('at', 'desc'), limit(100)))); },
  async promoCreate(code, amount, max) {
    needAdm();
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 3 || code.length > 20) throw new Error('badcode');
    amount = Math.floor(+amount || 0);
    if (!(amount >= 1 && amount <= 1e9)) throw new Error('badamt');
    max = Math.max(0, Math.min(1e6, Math.floor(+max || 0)));
    if ((await getDoc(doc(db, 'promos', code))).exists()) throw new Error('exists');
    await setDoc(doc(db, 'promos', code), { code, amount, max, used: 0, at: Date.now(), by: me.uid, byName: myNick() });
  },
  async promoDel(code) { needAdm(); await deleteDoc(doc(db, 'promos', cleanUid(code))); },
  async ban(uid, nick, reason, hours) {
    needAdm();
    uid = cleanUid(uid);
    if (!uid) throw new Error('nouid');
    if (uid === me.uid) throw new Error('self');
    const a = await getDoc(doc(db, 'admins', uid));
    if (a.exists()) throw new Error('isadmin');
    hours = Math.max(0, Math.min(24 * 365, +hours || 0));
    const d = {
      uid, nick: cleanNick(nick),
      reason: String(reason || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 200) || 'Нарушение правил',
      until: hours ? Date.now() + hours * 36e5 : 0, at: Date.now(), by: me.uid, byName: myNick()
    };
    // полная запись бана (приватная) + публичная отметка «забанен» для плашки в рейтинге
    await runTransaction(db, async (tx) => {
      tx.set(doc(db, 'bans', uid), d);
      tx.set(doc(db, 'banpub', uid), { uid, nick: d.nick, until: d.until, at: d.at });
    });
    return d;
  },
  unban(uid) {
    needAdm();
    uid = cleanUid(uid);
    return runTransaction(db, async (tx) => {
      tx.delete(doc(db, 'bans', uid));
      tx.delete(doc(db, 'banpub', uid));
    });
  },
  async addAdmin(uid, nick) {
    needOwner();
    uid = cleanUid(uid);
    if (!uid) throw new Error('nouid');
    const b = await getDoc(doc(db, 'bans', uid));
    if (b.exists()) throw new Error('isbanned');
    await setDoc(doc(db, 'admins', uid), { nick: cleanNick(nick), owner: false, at: Date.now(), by: me.uid });
  },
  async delAdmin(uid) {
    needOwner();
    uid = cleanUid(uid);
    const a = await getDoc(doc(db, 'admins', uid));
    if (a.exists() && a.data().owner) throw new Error('isowner');
    await deleteDoc(doc(db, 'admins', uid));
  }
};

// ---- промокоды от админов, начисления денег, присутствие («онлайн») ----
AE.promoUse = async (code) => {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code || !me || !me.uid) throw new Error('nocode');
  const pr = doc(db, 'promos', code), us = doc(db, 'promo_uses', code + '_' + me.uid);
  return await runTransaction(db, async (tx) => {
    const p = await tx.get(pr);
    if (!p.exists()) throw new Error('nocode');
    if ((await tx.get(us)).exists()) throw new Error('used');
    const d = p.data();
    if (+d.max > 0 && (+d.used || 0) >= +d.max) throw new Error('limit');
    tx.set(us, { code, uid: me.uid, at: Date.now() });
    tx.update(pr, { used: (+d.used || 0) + 1 });
    return Math.max(0, Math.floor(+d.amount || 0));
  });
};
let grantUnsub = null, beatTimer = null;
const grantBusy = new Set();
function watchGrants(user) {
  if (grantUnsub) { try { grantUnsub(); } catch (e) {} }
  grantUnsub = onSnapshot(query(collection(db, 'grants'), where('to', '==', user.uid), where('done', '==', false), limit(20)), (snap) => {
    snap.docs.forEach(async (d) => {
      if (grantBusy.has(d.id)) return;
      grantBusy.add(d.id);
      try {
        await updateDoc(doc(db, 'grants', d.id), { done: true }); // забираем один раз: второе устройство получит отказ
        const x = d.data();
        if (x.take) { if (AE.debit) AE.debit(+x.amount || 0, x.byName); } else if (AE.credit) AE.credit(+x.amount || 0, x.byName);
      } catch (e) { console.error('Начисление', e); }
    });
  }, (err) => console.error('Начисления: ошибка чтения', err));
}
function startPresence(user) {
  if (beatTimer) clearInterval(beatTimer);
  const beat = () => {
    if (document.hidden || !AE.fb.on) return;
    setDoc(doc(db, 'presence', user.uid), { t: Date.now(), nick: cleanNick(AE.name ? AE.name() : me.nick) }).catch(() => {});
  };
  beat();
  beatTimer = setInterval(beat, 60000);
}

// роли для плашек в рейтинге: adm[uid] = 2 владелец / 1 админ, ban[uid] = до какого времени (0 — навсегда)
AE.net.roles = async () => {
  const [a, b] = await Promise.all([
    getDocs(query(collection(db, 'admins'), limit(200))),
    getDocs(query(collection(db, 'banpub'), limit(500)))
  ]);
  const adm = {}, ban = {};
  a.docs.forEach((d) => { adm[d.id] = d.data().owner ? 2 : 1; });
  b.docs.forEach((d) => { ban[d.id] = +d.data().until || 0; });
  return { adm, ban };
};

// ---- чат ----
const CHAT_CLEAR_TS = 1793214844425; // всё, что написано раньше, скрыто
function subscribeChat() {
  if (subscribed) return;
  subscribed = true;
  const q = query(collection(db, "chat_messages"), orderBy("timestamp", "desc"), limit(50));
  onSnapshot(q, (snap) => {
    const arr = [];
    snap.forEach((d) => {
      const m = d.data();
      if ((m.timestamp || 0) < CHAT_CLEAR_TS) return;
      arr.push({ n: m.username, t: m.text, uid: m.userId, ts: m.timestamp || 0, lid: m.lid || '' });
    });
    AE.live = arr;
    if (AE.draw) AE.draw();
  }, (err) => console.error("Чат: ошибка чтения", err));
}

function setupChat(user) {
  AE.uid = user.uid;
  AE.send = async (text, lid) => {
    text = String(text).trim().slice(0, 120);
    if (!text) return;
    if (AE.banned) throw new Error('banned');
    const now = Date.now();
    if (now - lastSend < 1500) throw new Error('slow');
    lastSend = now;
    const n = cleanNick(AE.name ? AE.name() : me.nick);
    await addDoc(collection(db, "chat_messages"), {
      text, userId: user.uid, username: n, timestamp: now, ...(lid ? { lid: String(lid).slice(0, 40) } : {})
    });
  };
  subscribeChat();
}

// ---- состояние входа ----
async function proceed(user) {
  if (started) return;
  started = true;

  let d = null, offline = false;
  me = { uid: user.uid, nick: 'Игрок', createdAt: Date.now() };
  try {
    const s = await withTimeout(getDoc(userRef()), 10000);
    d = s.exists() ? s.data() : null;
  } catch (e) { offline = true; d = null; console.error('Облако: профиль недоступен', e); }

  me.nick = cleanNick((d && d.nick) || AE.pendingNick || user.displayName || (user.email || '').split('@')[0]);
  me.createdAt = (d && d.createdAt) || Date.now();

  // --- проверка бана ---
  try {
    const bs = await withTimeout(getDoc(doc(db, 'bans', user.uid)), 8000);
    if (bs.exists() && banActive(bs.data())) { AE.banned = bs.data(); showBan(AE.banned); return; }
  } catch (e) { console.error('Проверка бана', e); }

  // --- роль: владелец (по e-mail) или админ (документ admins/uid) ---
  const owner = !!user.emailVerified && OWNER_EMAILS.some((m) => m.toLowerCase() === String(user.email || '').toLowerCase());
  let adm = owner;
  if (owner) { try { await setDoc(doc(db, 'admins', user.uid), { nick: me.nick, owner: true, at: Date.now() }, { merge: true }); } catch (e) { console.error('Запись владельца', e); } }
  else { try { adm = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch (e) { adm = false; } }
  AE.admin = { on: adm, owner };

  AE.fb.on = true;
  setupChat(user);
  // бан «вживую»: если админ забанил во время игры — сразу выкидываем
  try {
    onSnapshot(doc(db, 'bans', user.uid), (sn) => {
      if (sn.exists() && banActive(sn.data())) { AE.banned = sn.data(); AE.fb.on = false; AE.send = null; showBan(AE.banned); }
    }, () => {});
  } catch (e) {}
  AE.onUser && AE.onUser({ uid: user.uid, email: user.email, nick: me.nick }, d, offline);
  try { startPresence(user); setTimeout(() => watchGrants(user), 3000); } catch (e) { console.error(e); }
  if (adm && AE.onAdmin) AE.onAdmin();
}

onAuthStateChanged(auth, async (user) => {
  AE.fbReady = true;
  if (user && user.isAnonymous) {          // старые анонимные сессии больше не нужны
    try { await signOut(auth); } catch (e) {}
    return;
  }
  if (!user) {
    AE.fb.on = false; AE.uid = null; AE.send = null;
    if (started) { location.reload(); return; }
    AE.onNoUser && AE.onNoUser();
    return;
  }
  if (started) return;
  // подтверждение почты больше не требуется: письма не доходили, вход открыт сразу после регистрации
  await proceed(user);
});
