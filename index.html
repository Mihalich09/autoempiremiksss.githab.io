.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora:before{content:"";position:absolute;left:-25%;right:-25%;top:10%;height:36%;background:linear-gradient(100deg,transparent 8%,rgba(60,230,200,.32) 34%,rgba(150,110,255,.32) 62%,transparent 92%);filter:blur(46px);transform:rotate(-12deg);opacity:var(--ao);animation:rib 18s ease-in-out infinite alternate}

.aurora i:nth-child(1){left:-30vmax;top:-34vmax;background:radial-gradient(circle,#7c5cff 0,transparent 62%);animation:a1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-36vmax;top:6vmax;background:radial-gradient(circle,#14d2c0 0,transparent 62%);animation:a2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:-22vmax;bottom:-46vmax;background:radial-gradient(circle,#ff5fa2 0,transparent 62%);animation:a3 29s ease-in-out infinite alternate}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, signInWithRedirect, GoogleAuthProvider, sendPasswordResetEmail, sendEmailVerification, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, addDoc, onSnapshot, query, orderBy, limit, where, getDocs, startAt, endAt, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCO4UCbaNvPnJfY1EfBeRHhyTjblBSkMq4",
  authDomain: "auto-empire-f4658.firebaseapp.com",
  projectId: "auto-empire-f4658",
  storageBucket: "auto-empire-f4658.firebasestorage.app",
  messagingSenderId: "1032641790212",
  appId: "1:1032641790212:web:86cd3be3e9289aaf28d051",
  measurementId: "G-K84BGNR5ZB"
};

const AE = (window.AE = window.AE || { live: [], uid: null, send: null });
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let me = null, started = false, subscribed = false, lastSend = 0;
const cleanNick = (s) => {
  s = String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 20);
  return s || 'Игрок';
};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const userRef = () => doc(db, 'users', me.uid);
async function sendVerify(u) {
  try { await sendEmailVerification(u, { url: location.origin + location.pathname }); }
  catch (e) {
    if (e && e.code === 'auth/too-many-requests') throw e;
    await sendEmailVerification(u);
  }
}

// ---- API для кода игры ----
AE.fb = {
  on: false,
  signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
  signUp: async (email, pw, nick) => {
    AE.pendingNick = nick;
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    try { await updateProfile(cred.user, { displayName: nick }); } catch (e) {}
    AE.mailErr = null;
    try { await sendVerify(cred.user); } catch (e) { console.error('Письмо подтверждения не отправлено', e); AE.mailErr = e; }
    return cred;
  },
  google: async () => {
    const pr = new GoogleAuthProvider();
    pr.setCustomParameters({ prompt: 'select_account' });
    try { return await signInWithPopup(auth, pr); }
    catch (e) {
      // окно заблокировано браузером — открываем вход Google на этой же вкладке
      if (e && (e.code === 'auth/popup-blocked') && location.protocol !== 'file:') return signInWithRedirect(auth, pr);
      throw e;
    }
  },
  reset: (email) => sendPasswordResetEmail(auth, email),
  resend: () => sendVerify(auth.currentUser),
  checkVerified: async () => {
    const u = auth.currentUser;
    if (!u) return false;
    await u.reload();
    if (!u.emailVerified) return false;
    await u.getIdToken(true);          // обновить токен: в нём появляется email_verified
    await proceed(u);
    return true;
  },
  out: async () => { try { await signOut(auth); } catch (e) {} location.reload(); },
  get: async () => { const s = await withTimeout(getDoc(userRef()), 10000); return s.exists() ? s.data() : null; },
  save: (p) => {
    if (p.nick) me.nick = cleanNick(p.nick);
    return setDoc(userRef(), { nick: me.nick, createdAt: me.createdAt, savedAt: p.savedAt, sid: p.sid, state: p.state }, { merge: true });
  },
  profile: (extra) => setDoc(userRef(), { nick: me.nick, createdAt: me.createdAt, ...extra }, { merge: true })
};

// ---- онлайн: друзья, публичные профили, объявления, обмен ----
const rnd7 = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 7; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
const myNick = () => cleanNick(AE.name ? AE.name() : me.nick);
const logErr = (t) => (e) => console.error(t, e);
const gone = () => new Error('gone');

AE.net = {
  // --- реферальная программа ---
  async ensureCode(prev) {
    if (prev) {
      try { const s = await getDoc(doc(db, 'refcodes', prev)); if (s.exists() && s.data().uid === me.uid) return prev; } catch (e) {}
    }
    for (let i = 0; i < 6; i++) {
      const c = rnd7(), r = doc(db, 'refcodes', c);
      try {
        const s = await getDoc(r);
        if (s.exists()) continue;
        await setDoc(r, { uid: me.uid, at: Date.now() });
        return c;
      } catch (e) { console.error('refcode', e); }
    }
    return prev || '';
  },
  async redeem(code, lv) {
    code = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) throw new Error('nocode');
    const cs = await getDoc(doc(db, 'refcodes', code));
    if (!cs.exists()) throw new Error('nocode');
    const referrer = cs.data().uid;
    if (referrer === me.uid) throw new Error('self');
    const mine = await getDoc(doc(db, 'referrals', me.uid));
    if (mine.exists()) throw new Error('already');
    await setDoc(doc(db, 'referrals', me.uid), { referrer, code, nick: myNick(), lv: Math.max(1, lv | 0), paid: false, at: Date.now() });
    return code;
  },
  async refList() { return rows(await getDocs(query(collection(db, 'referrals'), where('referrer', '==', me.uid)))); },
  refPay: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'referrals', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.paid || d.referrer !== me.uid || (d.lv || 1) < 2) throw gone();
    tx.update(r, { paid: true });
    return true;
  }),
  refBig: () => setDoc(doc(db, 'refclaims', me.uid), { at: Date.now() }),
  refLv: (lv, nick) => updateDoc(doc(db, 'referrals', me.uid), { lv: lv | 0, nick: cleanNick(nick) }),

  // --- публичные профили ---
  pubPush: (d) => setDoc(doc(db, 'public', me.uid), d),
  imgPush: (d) => setDoc(doc(db, 'public_img', me.uid), d),
  async pubGet(uid) {
    const a = await getDoc(doc(db, 'public', uid));
    if (!a.exists()) return null;
    const d = a.data(); d.uid = uid; d.img = null;
    if (d.hasAv || d.hasBn) { try { const b = await getDoc(doc(db, 'public_img', uid)); if (b.exists()) d.img = b.data(); } catch (e) {} }
    return d;
  },
  async top() {
    const s = await getDocs(query(collection(db, 'public'), orderBy('nw', 'desc'), limit(30)));
    return s.docs.map((d) => ({ ...d.data(), uid: d.id }));
  },
  async find(q) {
    q = String(q || '').trim().toLowerCase().slice(0, 20);
    if (!q) return [];
    const s = await getDocs(query(collection(db, 'public'), orderBy('nickLower'), startAt(q), endAt(q + '\uf8ff'), limit(15)));
    return s.docs.map((d) => ({ ...d.data(), uid: d.id }));
  },

  // --- объявления ---
  watchAds(cb) {
    let unsub = () => {};
    const run = (full) => {
      const q = full
        ? query(collection(db, 'listings'), orderBy('createdAt', 'desc'), limit(120))
        : query(collection(db, 'listings'), where('status', '==', 'open'), orderBy('createdAt', 'desc'), limit(80));
      unsub = onSnapshot(q, (s) => cb(rows(s)), (err) => {
        console.error('Объявления', err);
        if (!full && err && err.code === 'failed-precondition') run(true);   // нет составного индекса: читаем без фильтра
      });
    };
    run(false);
    return () => unsub();
  },
  watchMine: (cb) => onSnapshot(query(collection(db, 'listings'), where('seller', '==', me.uid), where('claimed', '==', false)), (s) => cb(rows(s)), logErr('Мои объявления')),
  watchBought: (cb) => onSnapshot(query(collection(db, 'listings'), where('buyer', '==', me.uid), where('paid', '==', false)), (s) => cb(rows(s)), logErr('Покупки')),
  async post(l) {
    const r = await addDoc(collection(db, 'listings'), {
      seller: me.uid, sn: myNick(), car: l.car, price: l.price, note: l.note || '',
      status: 'open', buyer: '', bn: '', createdAt: Date.now(), soldAt: 0, claimed: false, paid: false
    });
    return r.id;
  },
  buy: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'listings', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.seller === me.uid) throw gone();
    tx.update(r, { status: 'sold', buyer: me.uid, bn: myNick(), soldAt: Date.now() });
    return d;
  }),
  cancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'listings', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.seller !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled' });
    return d;
  }),
  claimed: (id) => updateDoc(doc(db, 'listings', id), { claimed: true }),
  paid: (id) => updateDoc(doc(db, 'listings', id), { paid: true }),
  delListing: (id) => deleteDoc(doc(db, 'listings', id)),

  // --- обмен ---
  watchTrades(cb) {
    let a = [], b = [];
    const emit = () => cb(a.concat(b.filter((x) => !a.some((y) => y.id === x.id))));
    const u1 = onSnapshot(query(collection(db, 'trades'), where('from', '==', me.uid)), (s) => { a = rows(s); emit(); }, logErr('Обмен (исходящие)'));
    const u2 = onSnapshot(query(collection(db, 'trades'), where('to', '==', me.uid)), (s) => { b = rows(s); emit(); }, logErr('Обмен (входящие)'));
    return () => { u1(); u2(); };
  },
  async offer(t) {
    const r = await addDoc(collection(db, 'trades'), {
      from: me.uid, fn: myNick(), to: t.to, tn: t.tn, carA: t.carA, wantId: t.wantId, wantN: t.wantN, wantV: t.wantV,
      status: 'open', carB: null, fromDone: false, toDone: false, createdAt: Date.now()
    });
    return r.id;
  },
  tAccept: (id, carB) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.to !== me.uid) throw gone();
    tx.update(r, { status: 'accepted', carB, at: Date.now() });
    return d;
  }),
  tDecline: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().to !== me.uid) throw gone();
    tx.update(r, { status: 'declined', at: Date.now() });
    return true;
  }),
  tCancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().from !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled', at: Date.now() });
    return true;
  }),
  tDone: (id, side) => updateDoc(doc(db, 'trades', id), side === 'from' ? { fromDone: true } : { toDone: true }),
  tDel: (id) => deleteDoc(doc(db, 'trades', id)),

  // --- онлайн-торги ---
  watchAuc: (cb) => onSnapshot(query(collection(db, 'auctions'), where('status', '==', 'open'), limit(60)), (s) => cb(rows(s)), logErr('Торги')),
  watchAucMine: (cb) => onSnapshot(query(collection(db, 'auctions'), where('seller', '==', me.uid), where('sellerDone', '==', false)), (s) => cb(rows(s)), logErr('Мои торги')),
  watchAucWon: (cb) => onSnapshot(query(collection(db, 'auctions'), where('buyer', '==', me.uid), where('buyerDone', '==', false)), (s) => cb(rows(s)), logErr('Выигранные торги')),
  async aPost(a) {
    const r = await addDoc(collection(db, 'auctions'), {
      seller: me.uid, sn: myNick(), car: a.car, start: a.start, bid: a.start, lead: '', ln: '', cnt: 0, end: a.end,
      status: 'open', buyer: '', bn: '', buyerDone: false, sellerDone: false, createdAt: Date.now()
    });
    return r.id;
  },
  aBid: (id, amount) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data(), now = Date.now();
    if (d.status !== 'open' || d.end <= now || d.seller === me.uid || d.lead === me.uid) throw gone();
    const cnt = d.cnt || 0, min = cnt ? d.bid + Math.max(500, Math.round(d.bid * 0.03 / 500) * 500) : d.start;
    if (amount < min) throw new Error('low');
    tx.update(r, { bid: amount, lead: me.uid, ln: myNick(), cnt: cnt + 1, end: (d.end - now < 10000 ? now + 10000 : d.end) });
    return true;
  }),
  aWin: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.lead !== me.uid || d.end > Date.now()) throw gone();
    tx.update(r, { status: 'sold', buyer: me.uid, bn: myNick(), buyerDone: false });
    return d;
  }),
  aClose: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'auctions', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data(), now = Date.now(), cnt = d.cnt || 0;
    if (d.status !== 'open' || d.seller !== me.uid) throw gone();
    if (cnt > 0 && now <= d.end + 600000) throw gone();
    tx.update(r, { status: cnt > 0 ? 'unsold' : 'cancelled' });
    return true;
  }),
  aSellerDone: (id) => updateDoc(doc(db, 'auctions', id), { sellerDone: true }),
  aBuyerDone: (id) => updateDoc(doc(db, 'auctions', id), { buyerDone: true }),
  aDel: (id) => deleteDoc(doc(db, 'auctions', id))
};

// ---- чат ----
function subscribeChat() {
  if (subscribed) return;
  subscribed = true;
  const q = query(collection(db, "chat_messages"), orderBy("timestamp", "desc"), limit(50));
  onSnapshot(q, (snap) => {
    const arr = [];
    snap.forEach((d) => {
      const m = d.data();
      arr.push({ n: m.username, t: m.text, uid: m.userId, ts: m.timestamp || 0, lid: m.lid || '' });
    });
    AE.live = arr;
    if (AE.draw) AE.draw();
  }, (err) => console.error("Чат: ошибка чтения", err));
}

function setupChat(user) {
  AE.uid = user.uid;
  AE.send = async (text, lid) => {
    text = String(text).trim().slice(0, 120);
    if (!text) return;
    const now = Date.now();
    if (now - lastSend < 1500) throw new Error('slow');
    lastSend = now;
    const n = cleanNick(AE.name ? AE.name() : me.nick);
    await addDoc(collection(db, "chat_messages"), {
      text, userId: user.uid, username: n, timestamp: now, ...(lid ? { lid: String(lid).slice(0, 40) } : {})
    });
  };
  subscribeChat();
}

// ---- состояние входа ----
async function proceed(user) {
  if (started) return;
  started = true;

  let d = null, offline = false;
  me = { uid: user.uid, nick: 'Игрок', createdAt: Date.now() };
  try {
    const s = await withTimeout(getDoc(userRef()), 10000);
    d = s.exists() ? s.data() : null;
  } catch (e) { offline = true; d = null; console.error('Облако: профиль недоступен', e); }

  me.nick = cleanNick((d && d.nick) || AE.pendingNick || user.displayName || (user.email || '').split('@')[0]);
  me.createdAt = (d && d.createdAt) || Date.now();

  AE.fb.on = true;
  setupChat(user);
  AE.onUser && AE.onUser({ uid: user.uid, email: user.email, nick: me.nick }, d, offline);
}

onAuthStateChanged(auth, async (user) => {
  AE.fbReady = true;
  if (user && user.isAnonymous) {          // старые анонимные сессии больше не нужны
    try { await signOut(auth); } catch (e) {}
    return;
  }
  if (!user) {
    AE.fb.on = false; AE.uid = null; AE.send = null;
    if (started) { location.reload(); return; }
    AE.onNoUser && AE.onNoUser();
    return;
  }
  if (started) return;
  if (!user.emailVerified) {               // почта не подтверждена: в игру не пускаем
    AE.fb.on = false;
    AE.onVerify && AE.onVerify({ email: user.email });
    return;
  }
  await proceed(user);
});
</script>
