<style>
:root{--bg:#000;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#fff;--mut:#9aa3b2;--gold:#6ecbff;--gt:#04141f;--ok:#7dffb0;--bad:#ff6b6b;--a0:#c6ecff;--a1:#8fd8ff;--a2:#2fa8ee;--a3:#16639a;--gl:110,203,255;--sh:0 12px 34px rgba(0,0,0,.6);--hi:rgba(255,255,255,.3);--inp:rgba(255,255,255,.08);--mbg:rgba(16,17,20,.92);--pill:rgba(255,255,255,.15);--b1:#c6ecff;--b2:#4db8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#eef1f6;--card:rgba(255,255,255,.7);--line:rgba(255,255,255,.95);--tx:#10151f;--mut:#5a6275;--gold:#0b78c0;--gt:#04141f;--ok:#12824f;--bad:#c03636;--a0:#bfe6ff;--a1:#6cc3f5;--a2:#1d8fd8;--a3:#0e5a94;--gl:30,140,220;--sh:0 0 0 1px rgba(60,80,120,.09),0 10px 26px rgba(50,70,110,.13);--hi:rgba(255,255,255,.95);--inp:rgba(255,255,255,.8);--mbg:rgba(255,255,255,.94);--pill:rgba(255,255,255,.9);--b1:#0b78c0;--b2:#2fa8ee;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.18em;color:var(--gold);font-size:13px}
.stats{display:flex;gap:8px;margin-top:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--mut);font-size:11px}.stat b{font-size:16px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:11px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--gold);font-weight:700}
h2{margin:0 0 4px;font-size:20px}h3{margin:0}
p{margin:4px 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0;font-size:13px}
.grid span{color:var(--mut)}.grid b{color:var(--tx);float:right}
button.b{background:var(--gold);color:var(--gt);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
button.b.o{background:none;color:var(--gold);border:1px solid var(--gold)}
button.b:disabled{opacity:.4;cursor:not-allowed}
.tap{display:block;width:100%;height:150px;font-size:22px;border-radius:20px;margin:10px 0;position:relative;overflow:hidden;user-select:none;touch-action:manipulation}
.tap:active{transform:scale(.98)}
.fl{position:absolute;pointer-events:none;font-size:18px;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.s{opacity:1}
.mt{color:var(--mut);font-size:12px}
html{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(700px 360px at 85% -8%,rgba(var(--gl),.16),transparent 70%),radial-gradient(500px 300px at -10% 110%,rgba(var(--gl),.08),transparent 70%),var(--bg)}
h2,h3,.brand,.stat b,.tap{font-family:Sora,Manrope,system-ui,sans-serif}
h2{font-size:22px;letter-spacing:-.01em;margin-bottom:6px}
header{background:linear-gradient(180deg,rgba(var(--gl),.07),transparent);padding-top:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:.2em;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand svg{width:22px;height:22px;color:var(--gold);flex:none}
.brand small{margin-left:auto;font:600 9px Manrope,sans-serif;letter-spacing:.18em;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.stat{border-radius:14px;background:linear-gradient(160deg,var(--card),transparent),var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.stat:first-child b{color:var(--gold)}
.stat small{text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.stat b{font-size:15px;font-weight:700;display:block;margin-top:2px}
.bar{height:8px;border-radius:9px}
.bar i{background:linear-gradient(90deg,var(--a2),var(--a1));box-shadow:0 0 10px rgba(var(--gl),.5)}
#et{margin-top:4px;font-size:11px;letter-spacing:.04em}
.card{border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:in .28s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card h3{font-size:16px}
.hero{text-align:center;background:linear-gradient(145deg,rgba(var(--gl),.18),transparent 62%),var(--card);border-color:rgba(var(--gl),.35)}
.tapw{display:grid;place-items:center;margin:16px 0 8px}
button.b{background:linear-gradient(180deg,var(--a1),var(--a2));box-shadow:0 4px 14px rgba(var(--gl),.28);transition:transform .12s,filter .15s}
button.b:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button.b:active:not(:disabled){transform:scale(.97)}
button.b.o{background:none;box-shadow:none;color:var(--gold)}
button.b.tap{width:172px;height:172px;border-radius:50%;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:800;letter-spacing:.14em;background:radial-gradient(circle at 35% 28%,var(--a0),var(--gold) 52%,var(--a3));box-shadow:0 0 0 9px rgba(var(--gl),.12),0 0 46px rgba(var(--gl),.4),inset 0 -8px 16px rgba(0,0,0,.28);animation:pulse 2.6s ease-in-out infinite}

header,.card,nav,.menu,#gate .g{border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1)),var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:var(--sh),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.08)}

/* ---- ГАРАЖ: машина на фоне гаража (7 PNG + hue-rotate) ---- */
.gs{position:relative;margin:-15px -15px 12px;border-radius:18px 18px 0 0;overflow:hidden;aspect-ratio:16/10;min-height:180px;background:#14171d var(--gbg,none) center/cover no-repeat;isolation:isolate}

.gs-sh{position:absolute;left:50%;bottom:-3%;width:78%;height:15%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,0) 72%);filter:blur(5px);z-index:0}

@media(max-width:480px){.gs-md{font-size:13px}.gs-pr{font-size:12px}.gs-im{max-width:90%}}

/* ---- «Мой гараж»: процедурная сцена (слои SVG) ---- */
.gcs{position:relative;aspect-ratio:16/10;min-height:190px;margin:8px 0;border-radius:16px;overflow:hidden;background:#14171d;isolation:isolate;container-type:inline-size}

.gsg0{background:rgba(8,10,16,.62);text-shadow:0 0 8px var(--sc),0 0 2px var(--sc);box-shadow:0 0 14px var(--sc),inset 0 0 8px rgba(255,255,255,.08)}

.gsg2{background:linear-gradient(180deg,#eef1f6,#9aa3b2 55%,#cdd3dd);color:#171a21;text-shadow:0 1px 0 rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.5)}

.car{overflow:hidden;margin-bottom:14px}

.car-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 -15px 12px;padding:14px 16px;background:rgba(6,8,12,.82);border-top:1px solid rgba(255,255,255,.06)}
.car-ft h3{min-width:0;font-size:16px;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car>.art .av{background:linear-gradient(145deg,#3fdc86,#12a35a)!important;top:10px;right:12px}
.car>.art .seg{top:12px}
.car-km{flex:none;font-size:13px;font-weight:600;color:#aab3c2;white-space:nowrap}
.gst{margin:10px 2px 0}.gst b{color:var(--ok)}
.gcg button i.gsw{font-style:normal;font-weight:800;position:static;transform:none;max-width:none;display:grid;place-items:center;height:34px;padding:0 4px;font-size:11px;letter-spacing:.03em;border-radius:7px;overflow:hidden}
/* ---- компактная шапка: главная — уменьшенная статистика, остальные вкладки — без неё ---- */
header{padding:8px 12px;margin-top:8px}
header .stats{gap:6px;margin-top:6px}
header .stat{padding:4px 8px;border-radius:12px;min-width:0;box-shadow:none}
header .stat small{font-size:9px;line-height:1.2;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .stat b{font-size:13px;line-height:1.2;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .bar{height:4px;margin-top:5px}
header #et{margin-top:2px;font-size:10px;line-height:1.2}
header #ev{font-size:10px;padding:1px 6px;margin-top:3px!important}
header.no-stats{padding-top:6px;padding-bottom:6px}
header.no-stats .stats,header.no-stats .bar,header.no-stats #et,header.no-stats #ev{display:none!important}
/* ===== «Один вход 26 октября» — экран блокировки ===== */
#ae-lock{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;text-align:center;color:var(--tx);background:radial-gradient(700px 420px at 50% -10%,rgba(var(--gl),.28),transparent 70%),radial-gradient(520px 320px at 50% 115%,rgba(var(--gl),.14),transparent 70%),var(--bg)}
#ae-lock .lk{width:100%;max-width:560px}
#ae-lock .lk-brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--gold)}
#ae-lock .lk-brand svg{width:22px;height:22px;fill:currentColor}
#ae-lock h1{margin:22px 0 10px;font:800 clamp(26px,7vw,40px)/1.15 Sora,Manrope,system-ui,sans-serif;letter-spacing:-.01em}
#ae-lock .lk-sub{margin:0 auto;max-width:460px;color:var(--mut);font-size:15px;line-height:1.55}
#ae-lock .lk-timer{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,14px);margin:34px 0 10px;padding:clamp(18px,5vw,30px) clamp(14px,4vw,28px);border-radius:26px;border:1px solid rgba(var(--gl),.45);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 50%),var(--card);box-shadow:var(--sh),0 0 60px rgba(var(--gl),.22),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ae-lock .lk-timer b{font:800 clamp(44px,15vw,104px)/1 Sora,Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 28px rgba(var(--gl),.55)}
#ae-lock .lk-timer i{font:800 clamp(34px,11vw,80px)/1 Sora,system-ui,sans-serif;font-style:normal;color:var(--mut);animation:lkb 1s steps(2,jump-none) infinite}
#ae-lock .lk-cap{display:flex;justify-content:center;gap:clamp(40px,14vw,120px);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
@keyframes lkb{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#ae-lock .lk-timer i{animation:none}}

function settleMine(){var n=NET();if(!n)return;var ch=0;
 OL.mine.forEach(function(L){
  if(L.status=='sold'){var k='s'+L.id;
   if(!got(k)){var fee=Math.round(L.price*.03),net_=L.price-fee,pr=net_-L.car.paid;got(k,1);gain(net_,20+Math.max(0,Math.round(pr/2000)),'Продажа игроку '+L.bn+': '+L.car.n);S.st.sales++;S.st.profit+=pr;
    if(pr>0){S.rep+=2;S.dl.sell++;if(L.car.paid>0)S.st.best=Math.max(S.st.best,pr/L.car.paid)}save();toast('💰 '+L.bn+' купил(а) '+L.car.n+': +'+M(net_));cloudSave(true);ch=1}
   n.claimed(L.id).catch(function(){})}
  else if(L.status=='cancelled'&&!OL.pend['c'+L.id]){var k2='s'+L.id;
   if(!got(k2)){if(S.cars.length>=S.slots){OL.wait=1;return}got(k2,1);addCar(L.car,L.car.paid);save();cloudSave(true);toast('Машина вернулась в гараж: '+L.car.n);ch=1}
   n.claimed(L.id).then(function(){n.delListing(L.id)}).catch(function(){})}});
 if(ch)afterSettle()}

 OL.bought.forEach(function(L){var k='b'+L.id;if(OL.pend[k])return;
  if(!got(k)){if(S.cars.length>=S.slots){OL.wait=1;return}gain(-Math.min(S.money,L.price),10,'Покупка у игрока '+L.sn);addCar(L.car,L.price);got(k,1);save();cloudSave(true);toast('📦 Получена купленная машина: '+L.car.n);ch=1}
  n.paid(L.id).catch(function(){})});
 if(ch)afterSettle()}

 OL.tr.forEach(function(T){
  if(T.from==me&&T.fromDone&&(T.status!='accepted'||T.toDone))n.tDel(T.id).catch(function(){});
  if(T.from==me&&T.status!='open'&&!T.fromDone){var k='f'+T.id;
   if(!got(k)){if(S.cars.length>=S.slots){OL.wait=1;return}
    if(T.status=='accepted'&&T.carB){addCar(T.carB,safeVal(T.carA));S.rep+=1;log('Обмен с '+T.tn+': '+T.carA.n+' → '+T.carB.n);toast('🔁 Обмен состоялся: вы получили '+T.carB.n)}
    else if(T.status=='accepted'){gain(safeVal(T.carA),0,'Компенсация за обмен');toast('Обмен завершён: выдана компенсация за '+T.carA.n)}
    else{addCar(T.carA,T.carA.paid);toast('Обмен не состоялся — '+T.carA.n+' вернулась в гараж')}
    got(k,1);save();cloudSave(true);ch=1}
   n.tDone(T.id,'from').catch(function(){})}
  if(T.to==me&&T.status=='accepted'&&!T.toDone){var k2='t'+T.id;

   if(!OL.pend[k2])n.tDone(T.id,'to').catch(function(){})}});
 if(ch)afterSettle()}

let me = null, started = false, subscribed = false, lastSend = 0;
const cleanNick = (s) => {
  s = String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 20);
  return s || 'Игрок';
};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const userRef = () => doc(db, 'users', me.uid);
async function sendVerify(u) {
  try { await sendEmailVerification(u, { url: location.origin + location.pathname }); }
  catch (e) {
    if (e && e.code === 'auth/too-many-requests') throw e;
    await sendEmailVerification(u);
  }
}

// ---- API для кода игры ----
AE.fb = {
  on: false,
  signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
  signUp: async (email, pw, nick) => {
    AE.pendingNick = nick;
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    try { await updateProfile(cred.user, { displayName: nick }); } catch (e) {}
    try { await sendVerify(cred.user); } catch (e) { console.error('Письмо подтверждения не отправлено', e); }
    return cred;
  },
  google: async () => {
    const pr = new GoogleAuthProvider();
    pr.setCustomParameters({ prompt: 'select_account' });
    try { return await signInWithPopup(auth, pr); }
    catch (e) {
      // окно заблокировано браузером — открываем вход Google на этой же вкладке
      if (e && (e.code === 'auth/popup-blocked') && location.protocol !== 'file:') return signInWithRedirect(auth, pr);
      throw e;
    }
  },
  reset: (email) => sendPasswordResetEmail(auth, email),
  resend: () => sendVerify(auth.currentUser),
  checkVerified: async () => {
    const u = auth.currentUser;
    if (!u) return false;
    await u.reload();
    if (!u.emailVerified) return false;
    await u.getIdToken(true);          // обновить токен: в нём появляется email_verified
    await proceed(u);
    return true;
  },
  out: async () => { try { await signOut(auth); } catch (e) {} location.reload(); },
  get: async () => { const s = await withTimeout(getDoc(userRef()), 10000); return s.exists() ? s.data() : null; },
  save: (p) => {
    if (p.nick) me.nick = cleanNick(p.nick);
    return setDoc(userRef(), { nick: me.nick, createdAt: me.createdAt, savedAt: p.savedAt, sid: p.sid, state: p.state }, { merge: true });
  },
  profile: (extra) => setDoc(userRef(), { nick: me.nick, createdAt: me.createdAt, ...extra }, { merge: true })
};

// ---- онлайн: друзья, публичные профили, объявления, обмен ----
const rnd7 = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 7; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
const myNick = () => cleanNick(AE.name ? AE.name() : me.nick);
const logErr = (t) => (e) => console.error(t, e);
const gone = () => new Error('gone');

AE.net = {
  // --- платежи: заказ создаёт сервер (Result URL), игрок только забирает его ---
  payPending: async () => rows(await getDocs(query(collection(db, 'payments'), where('uid', '==', me.uid), where('claimed', '==', false)))),
  payClaim: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'payments', id), s = await tx.get(r);
    if (!s.exists() || s.data().claimed || s.data().uid !== me.uid) throw gone();
    tx.update(r, { claimed: true });
    return s.data().productId;
  }),
  // --- реферальная программа ---
  async ensureCode(prev) {
    if (prev) {
      try { const s = await getDoc(doc(db, 'refcodes', prev)); if (s.exists() && s.data().uid === me.uid) return prev; } catch (e) {}
    }
    for (let i = 0; i < 6; i++) {
      const c = rnd7(), r = doc(db, 'refcodes', c);
      try {
        const s = await getDoc(r);
        if (s.exists()) continue;
        await setDoc(r, { uid: me.uid, at: Date.now() });
        return c;
      } catch (e) { console.error('refcode', e); }
    }
    return prev || '';
  },
  async redeem(code, lv) {
    code = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) throw new Error('nocode');
    const cs = await getDoc(doc(db, 'refcodes', code));
    if (!cs.exists()) throw new Error('nocode');
    const referrer = cs.data().uid;
    if (referrer === me.uid) throw new Error('self');
    const mine = await getDoc(doc(db, 'referrals', me.uid));
    if (mine.exists()) throw new Error('already');
    await setDoc(doc(db, 'referrals', me.uid), { referrer, code, nick: myNick(), lv: Math.max(1, lv | 0), paid: false, at: Date.now() });
    return code;
  },
  async refList() { return rows(await getDocs(query(collection(db, 'referrals'), where('referrer', '==', me.uid)))); },
  refPay: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'referrals', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.paid || d.referrer !== me.uid || (d.lv || 1) < 2) throw gone();
    tx.update(r, { paid: true });
    return true;
  }),
  refBig: () => setDoc(doc(db, 'refclaims', me.uid), { at: Date.now() }),
  refLv: (lv, nick) => updateDoc(doc(db, 'referrals', me.uid), { lv: lv | 0, nick: cleanNick(nick) }),

  // --- публичные профили ---
  pubPush: (d) => setDoc(doc(db, 'public', me.uid), d),
  imgPush: (d) => setDoc(doc(db, 'public_img', me.uid), d),
  async pubGet(uid) {
    const a = await getDoc(doc(db, 'public', uid));
    if (!a.exists()) return null;
    const d = a.data(); d.uid = uid; d.img = null;
    if (d.hasAv || d.hasBn) { try { const b = await getDoc(doc(db, 'public_img', uid)); if (b.exists()) d.img = b.data(); } catch (e) {} }
    return d;
  },
  async top() {
    const s = await getDocs(query(collection(db, 'public'), orderBy('nw', 'desc'), limit(30)));
    return s.docs.map((d) => ({ ...d.data(), uid: d.id }));
  },
  async find(q) {
    q = String(q || '').trim().toLowerCase().slice(0, 20);
    if (!q) return [];
    const s = await getDocs(query(collection(db, 'public'), orderBy('nickLower'), startAt(q), endAt(q + '\uf8ff'), limit(15)));
    return s.docs.map((d) => ({ ...d.data(), uid: d.id }));
  },

  // --- объявления ---
  watchAds(cb) {
    let unsub = () => {};
    const run = (full) => {
      const q = full
        ? query(collection(db, 'listings'), orderBy('createdAt', 'desc'), limit(120))
        : query(collection(db, 'listings'), where('status', '==', 'open'), orderBy('createdAt', 'desc'), limit(80));
      unsub = onSnapshot(q, (s) => cb(rows(s)), (err) => {
        console.error('Объявления', err);
        if (!full && err && err.code === 'failed-precondition') run(true);   // нет составного индекса: читаем без фильтра
      });
    };
    run(false);
    return () => unsub();
  },
  watchMine: (cb) => onSnapshot(query(collection(db, 'listings'), where('seller', '==', me.uid), where('claimed', '==', false)), (s) => cb(rows(s)), logErr('Мои объявления')),
  watchBought: (cb) => onSnapshot(query(collection(db, 'listings'), where('buyer', '==', me.uid), where('paid', '==', false)), (s) => cb(rows(s)), logErr('Покупки')),
  async post(l) {
    const r = await addDoc(collection(db, 'listings'), {
      seller: me.uid, sn: myNick(), car: l.car, price: l.price, note: l.note || '',
      status: 'open', buyer: '', bn: '', createdAt: Date.now(), soldAt: 0, claimed: false, paid: false
    });
    return r.id;
  },
  buy: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'listings', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.seller === me.uid) throw gone();
    tx.update(r, { status: 'sold', buyer: me.uid, bn: myNick(), soldAt: Date.now() });
    return d;
  }),
  cancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'listings', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.seller !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled' });
    return d;
  }),
  claimed: (id) => updateDoc(doc(db, 'listings', id), { claimed: true }),
  paid: (id) => updateDoc(doc(db, 'listings', id), { paid: true }),
  delListing: (id) => deleteDoc(doc(db, 'listings', id)),

  // --- обмен ---
  watchTrades(cb) {
    let a = [], b = [];
    const emit = () => cb(a.concat(b.filter((x) => !a.some((y) => y.id === x.id))));
    const u1 = onSnapshot(query(collection(db, 'trades'), where('from', '==', me.uid)), (s) => { a = rows(s); emit(); }, logErr('Обмен (исходящие)'));
    const u2 = onSnapshot(query(collection(db, 'trades'), where('to', '==', me.uid)), (s) => { b = rows(s); emit(); }, logErr('Обмен (входящие)'));
    return () => { u1(); u2(); };
  },
  async offer(t) {
    const r = await addDoc(collection(db, 'trades'), {
      from: me.uid, fn: myNick(), to: t.to, tn: t.tn, carA: t.carA, wantId: t.wantId, wantN: t.wantN, wantV: t.wantV,
      status: 'open', carB: null, fromDone: false, toDone: false, createdAt: Date.now()
    });
    return r.id;
  },
  tAccept: (id, carB) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists()) throw gone();
    const d = s.data();
    if (d.status !== 'open' || d.to !== me.uid) throw gone();
    tx.update(r, { status: 'accepted', carB, at: Date.now() });
    return d;
  }),
  tDecline: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().to !== me.uid) throw gone();
    tx.update(r, { status: 'declined', at: Date.now() });
    return true;
  }),
  tCancel: (id) => runTransaction(db, async (tx) => {
    const r = doc(db, 'trades', id), s = await tx.get(r);
    if (!s.exists() || s.data().status !== 'open' || s.data().from !== me.uid) throw gone();
    tx.update(r, { status: 'cancelled', at: Date.now() });
    return true;
  }),
  tDone: (id, side) => updateDoc(doc(db, 'trades', id), side === 'from' ? { fromDone: true } : { toDone: true }),
  tDel: (id) => deleteDoc(doc(db, 'trades', id))
};

// ---- чат ----
function subscribeChat() {
  if (subscribed) return;
  subscribed = true;
  const q = query(collection(db, "chat_messages"), orderBy("timestamp", "desc"), limit(50));
  onSnapshot(q, (snap) => {
    const arr = [];
    snap.forEach((d) => {
      const m = d.data();
      arr.push({ n: m.username, t: m.text, uid: m.userId, ts: m.timestamp || 0, lid: m.lid || '' });
    });
    AE.live = arr;
    if (AE.draw) AE.draw();
  }, (err) => console.error("Чат: ошибка чтения", err));
}

function setupChat(user) {
  AE.uid = user.uid;
  AE.send = async (text, lid) => {
    text = String(text).trim().slice(0, 120);
    if (!text) return;
    const now = Date.now();
    if (now - lastSend < 1500) throw new Error('slow');
    lastSend = now;
    const n = cleanNick(AE.name ? AE.name() : me.nick);
    await addDoc(collection(db, "chat_messages"), {
      text, userId: user.uid, username: n, timestamp: now, ...(lid ? { lid: String(lid).slice(0, 40) } : {})
    });
  };
  subscribeChat();
}

// ---- состояние входа ----
async function proceed(user) {
  if (started) return;
  started = true;

  let d = null, offline = false;
  me = { uid: user.uid, nick: 'Игрок', createdAt: Date.now() };
  try {
    const s = await withTimeout(getDoc(userRef()), 10000);
    d = s.exists() ? s.data() : null;
  } catch (e) { offline = true; d = null; console.error('Облако: профиль недоступен', e); }

  me.nick = cleanNick((d && d.nick) || AE.pendingNick || user.displayName || (user.email || '').split('@')[0]);
  me.createdAt = (d && d.createdAt) || Date.now();

  AE.fb.on = true;
  setupChat(user);
  AE.onUser && AE.onUser({ uid: user.uid, email: user.email, nick: me.nick }, d, offline);
}

onAuthStateChanged(auth, async (user) => {
  AE.fbReady = true;
  if (user && user.isAnonymous) {          // старые анонимные сессии больше не нужны
    try { await signOut(auth); } catch (e) {}
    return;
  }
  if (!user) {
    AE.fb.on = false; AE.uid = null; AE.send = null;
    if (started) { location.reload(); return; }
    AE.onNoUser && AE.onNoUser();
    return;
  }
  if (started) return;
  if (!user.emailVerified) {               // почта не подтверждена: в игру не пускаем
    AE.fb.on = false;
    AE.onVerify && AE.onVerify({ email: user.email });
    return;
  }
  await proceed(user);
});
